apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.newgate.pos"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.newgate.pos"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.capacitorjs:core:8.5.2'

    // Android POS Room / SQLite Persistence for Open Orders, Tables, Perms, KDS, Queues, Business Day, Device Config
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.sqlite:sqlite-framework:2.4.0'
}

try {
    def capacitorPlugins = file('capacitor.build.gradle')
    if (capacitorPlugins.exists()) {
        apply from: 'capacitor.build.gradle'
    }
} catch(Exception e) {
    logger.warn("Could not apply capacitor.build.gradle: " + e.message)
}

task copyWebAssets(type: Copy) {
    from '../../dist'
    into 'src/main/assets/public'
}

tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets' || task.name == 'preBuild') {
        task.dependsOn copyWebAssets
    }
}

